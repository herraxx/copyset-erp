function missingFor(o,target){normalizeOrder(o);let m=[];
 const need=(ok,label)=>{if(!ok)m.push(label)};
 if(target==='Vahvistettu'){need(o.customerId||o.company,'Asiakas');need(o.contact,'Yhteyshenkilö');need(o.email,'Sähköposti');need(o.product,'Tuote');need(+o.qty>0,'Määrä');need(+o.price>0,'Työn hinta');need(o.deadline,'Deadline');need(o.shipping,'Toimitustapa');need(o.billingAddress,'Laskutusosoite');need(o.customerBid,'Y-tunnus');need(o.paymentTerms,'Maksuehto');if(o.production==='Alihankkija')need(o.supplierId,'Alihankkija');if(o.shipping!=='Nouto'){let ds=o.deliveries||[];need(ds.length>0,'Toimitusosoite');ds.forEach((d,i)=>{need(d.recipient,`Vastaanottaja ${i+1}`);need(d.address,`Osoite ${i+1}`);need(d.zip,`Postinumero ${i+1}`);need(d.city,`Kaupunki ${i+1}`);need(d.country,`Maa ${i+1}`)})}}
 if(target==='Tuotannossa'){need(o.artworkStatus==='Aineisto OK','Aineisto OK')}
 if(target==='Laskutusvalmis'){need(o.billingAddress,'Laskutusosoite');need(o.customerBid,'Y-tunnus');need(o.paymentTerms,'Maksuehto');need(o.no,'Tilausnumero');need(+o.price>0,'Työn hinta');need(o.shipping,'Toimitustapa')}
 if(target==='Laskutettu'){need(o.invoiceApproved,'Laskun hyväksyntä')}
 return m;
}

<script>
/* === Distinct Tarjous / Tilaus process and compact CRM === */
function modeBannerHtml(x){return `<div id="modeBanner" class="mode-banner ${x==='Tilaus'?'order':'quote'}"><div><strong>${x==='Tilaus'?'TILAUS':'TARJOUS'}</strong><div class="small">${x==='Tilaus'?'Suora tilaus: tarkista kaikki tiedot ja vahvista tilaus ennen tuotantoa.':'Tarjous: tarkista ja hyväksy tarjous ennen lähettämistä asiakkaalle.'}</div></div><span class="mode-chip">${x}</span></div>`}
const _orderFormModeUX=orderForm;
orderForm=function(o){
  let html=_orderFormModeUX(o);
  html=modeBannerHtml(o.mode||mode||'Tarjous')+html;
  html=html.replace('id="fstatus"','id="fstatus" disabled');
  html=html.replace(/✓ Tallenna tarjous|✓ Tallenna tilaus/g,'Tarkista tiedot →');
  html=html.replace(/onclick="saveOrder\(\)">✓ Tallenna [^<]+<\/button>/, 'onclick="saveOrder()">Tarkista tiedot →</button>');
  return html;
}
setMode=function(x){mode=x;let tq=document.getElementById('tQuote'),to=document.getElementById('tOrder');if(tq)tq.classList.toggle('on',x==='Tarjous');if(to)to.classList.toggle('on',x==='Tilaus');let b=document.getElementById('modeBanner');if(b)b.outerHTML=modeBannerHtml(x)}

function formOrderObject(){
  let prod=document.querySelector('[name=prod]:checked')?.value||'Copy-Set',vendor=prod==='Alihankkija'?(document.getElementById('fvendor')?.value||''):'';
  if(prod==='Alihankkija'&&!vendor){alert('Valitse alihankkija.');return null}
  let c=C(document.getElementById('fcustomer')?.value||''),ds=collect('[data-del]'),product=fproduct.value==='Oma tuote'?(fcustom.value||'Oma tuote'):fproduct.value,old=edit?st.orders.find(x=>x.id===edit):null;
  let o=normalizeOrder({id:edit||uid(),no:fno.value,name:fname.value,mode,customerId:fcustomer.value,date:ISO_DATE(fdate.value),deadline:ISO_DATE(fdeadline.value),valid:ISO_DATE(fvalid.value),deliveryDate:ISO_DATE(fdeliverydate.value),company:c?.company||ds[0]?.recipient||'',contact:fcontact.value,email:femail.value,phone:fphone.value,product,qty:+fqty.value||0,price:+fprice.value||0,deliveryPrice:+fdeliveryprice.value||0,status:old?.status||'Tarjous',production:prod,supplierId:vendor,shipping:fship.value,description:fdesc.value,contacts:collect('[data-con]'),deliveries:ds,billingAddress:fbilling.value,demo:false,setupFee:+fsetup.value||0,billingFee:+fbillfee.value||0,customerBid:fbid.value,paymentTerms:fterms.value,customerCountry:fcountry.value||'Suomi',orderReference:forderref.value,eInvoice:feinv.value,operator:foperator.value,extraLines:old?.extraLines||[],attachments:old?.attachments||[],history:old?.history||[],artworkStatus:old?.artworkStatus||'Ei tarkistettu',proofRequired:old?.proofRequired||false,proofStatus:old?.proofStatus||'Ei tarvita',issue:old?.issue||'',issueLevel:old?.issueLevel||'Huomio',estimatedCost:old?.estimatedCost||0,invoiceApproved:old?.invoiceApproved||false,invoiceApprovedAt:old?.invoiceApprovedAt||'',vatRate:old?.vatRate==null?autoVat({deliveries:ds,customerCountry:fcountry.value}):old.vatRate,invoiceNote:old?.invoiceNote||'',quoteApproved:old?.quoteApproved||false,quoteApprovedAt:old?.quoteApprovedAt||'',quoteSentAt:old?.quoteSentAt||''});
  if(old&&old.mode!==mode){o.quoteApproved=false;o.quoteApprovedAt='';o.quoteSentAt='';logEvent(o,`Tyyppi muutettu: ${old.mode} → ${mode}`)}
  return o;
}
saveOrder=function(){let o=formOrderObject();if(!o)return;let old=edit?st.orders.find(x=>x.id===edit):null;if(old){[['price','Hinta'],['deadline','Deadline'],['shipping','Toimitustapa'],['billingAddress','Laskutusosoite']].forEach(([k,l])=>{if(String(old[k]??'')!==String(o[k]??''))logEvent(o,`${l} muutettu: ${old[k]??'—'} → ${o[k]??'—'}`)})}else logEvent(o,(mode==='Tilaus'?'Tilaus':'Tarjous')+' luotu luonnoksena');if(edit)st.orders[st.orders.findIndex(x=>x.id===edit)]=o;else{st.orders.push(o);edit=o.id}save();renderAll();showPreflight(o.id)}

function reviewRows(o){let ds=o.deliveries||[];return `<div class="review-grid"><div class="review-card"><h4>ASIAKAS</h4><p><b>${E(o.company||'—')}</b><br>${E(o.contact||'—')}<br>${E(o.email||'—')} · ${E(o.phone||'—')}<br>Y-tunnus ${E(o.customerBid||'—')}</p></div><div class="review-card"><h4>TYÖ</h4><p><b>${E(o.product||'—')}</b> · ${E(o.qty||0)} kpl<br>${E(o.description||'Ei työohjetta')}<br>Deadline <b>${E(FI_DATE(o.deadline)||'—')}</b></p></div><div class="review-card"><h4>HINTA</h4><p>Työ ${EU(o.price||0)}<br>Aloitus ${EU(o.setupFee||0)}<br>Toimitus ${EU(o.deliveryPrice||0)}<br>Laskutuslisä ${EU(o.billingFee||0)}</p></div><div class="review-card"><h4>TOIMITUS & LASKUTUS</h4><p>${E(o.shipping||'—')} · ${ds.length} osoitetta<br>${E(o.billingAddress||'—')}<br>Maksuehto ${E(o.paymentTerms||'—')}</p></div><div class="review-card review-wide"><h4>TOIMITUSOSOITTEET</h4>${ds.length?ds.map((d,i)=>`<p><b>${i+1}. ${E(d.recipient||o.company)}</b> · ${E(d.address||'')} · ${E(d.zip||'')} ${E(d.city||'')} · ${E(d.country||'Suomi')}</p>`).join(''):'<p>Nouto / ei toimitusosoitetta</p>'}</div></div>`}
function showPreflight(id){let o=st.orders.find(x=>x.id===id);normalizeOrder(o);let m=missingFor(o,'Vahvistettu'),isOrder=o.mode==='Tilaus';mt.textContent=(isOrder?'Tarkista tilaus':'Tarkista tarjous')+' · #'+o.no;mb.innerHTML=`${modeBannerHtml(o.mode)}${m.length?`<div class="warnbar bad"><b>⚠ ${m.length} tietoa puuttuu</b><div class="miss">${m.map(x=>`<span>${E(x)}</span>`).join('')}</div><div class="small">Täydennä puuttuvat tiedot ennen hyväksyntää.</div></div>`:'<div class="warnbar ok"><b>✓ Kaikki pakolliset tiedot ovat kunnossa.</b><div class="small">Tarkista yhteenveto vielä kerran ennen hyväksyntää.</div></div>'}${reviewRows(o)}<div class="preflight-actions"><button class="btn" onclick="editOrder('${id}')">← Muokkaa tietoja</button>${isOrder?`<button class="btn orange big-primary ${m.length?'blocked':''}" onclick="approveDirectOrder('${id}')">✓ Hyväksy ja vahvista tilaus</button>`:`<button class="btn orange big-primary ${m.length?'blocked':''}" onclick="approveQuote('${id}')">✓ Hyväksy tarjous</button>`}</div>`;modal.classList.add('on')}
function approveDirectOrder(id){let o=st.orders.find(x=>x.id===id),m=missingFor(o,'Vahvistettu');if(m.length)return alert('Täydennä ensin: '+m.join(', '));o.mode='Tilaus';o.status='Vahvistettu';o.orderApprovedAt=nowFi();logEvent(o,'Tilaus tarkistettu ja vahvistettu');save();renderAll();showConfirmation(id)}
function approveQuote(id){let o=st.orders.find(x=>x.id===id),m=missingFor(o,'Vahvistettu');if(m.length)return alert('Täydennä ensin: '+m.join(', '));o.quoteApproved=true;o.quoteApprovedAt=nowFi();logEvent(o,'Tarjous tarkistettu ja hyväksytty lähettämistä varten');save();renderAll();showQuote(id)}
function quoteHtml(o){normalizeOrder(o);let t=invoiceTotals(o),ds=o.deliveries||[];return `<div class="quote-doc">${docShell('TARJOUS','Tarjous #'+o.no,`<div class="doc-grid"><div><b>ASIAKAS</b><br>${E(o.company)}<br>${E(o.contact)}<br>${E(o.email)} · ${E(o.phone)}</div><div><b>TARJOUSTIEDOT</b><br>Päivä ${E(FI_DATE(o.date)||'—')}<br>Voimassa ${E(FI_DATE(o.valid)||'—')} asti<br>Arvioitu toimitus ${E(FI_DATE(o.deliveryDate||o.deadline)||'—')}</div></div><div class="doc-section"><h3>TYÖ / TUOTE</h3><table class="doc-table"><tr><th>Tuote</th><th>Määrä</th><th>Toimitustapa</th></tr><tr><td><b>${E(o.product)}</b></td><td>${E(o.qty)} kpl</td><td>${E(o.shipping)}</td></tr></table><div class="doc-note" style="margin-top:10px">${E(o.description||'')}</div></div><div class="doc-section"><h3>HINTA</h3><table class="doc-table"><tr><td>Työ</td><td style="text-align:right">${EU(o.price)}</td></tr><tr><td>Aloituskustannus</td><td style="text-align:right">${EU(o.setupFee)}</td></tr>${+o.deliveryPrice?`<tr><td>Toimitus</td><td style="text-align:right">${EU(o.deliveryPrice)}</td></tr>`:''}<tr><td>Laskutuslisä</td><td style="text-align:right">${EU(o.billingFee)}</td></tr><tr><th>Yhteensä alv 0 %</th><th style="text-align:right">${EU(t.net)}</th></tr><tr><td>ALV ${String(o.vatRate).replace('.',',')} %</td><td style="text-align:right">${EU(t.vat)}</td></tr><tr><th>Yhteensä sis. ALV</th><th style="text-align:right">${EU(t.total)}</th></tr></table></div><div class="doc-section"><h3>TOIMITUS</h3>${ds.map((d,i)=>`<p><b>${i+1}. ${E(d.recipient||o.company)}</b><br>${E(d.address||'')} ${E(d.zip||'')} ${E(d.city||'')} ${E(d.country||'Suomi')}</p>`).join('')||'<p>Nouto</p>'}</div>`)}</div>`}
function showQuote(id){let o=st.orders.find(x=>x.id===id);mt.textContent='Tarjous · #'+o.no;mb.innerHTML=`${o.quoteApproved?'<div class="warnbar ok"><b>✓ Tarjous on sisäisesti hyväksytty.</b><div class="small">Nyt sen voi lähettää asiakkaalle.</div></div>':'<div class="warnbar bad"><b>Tarjousta ei ole vielä hyväksytty.</b></div>'}${quoteHtml(o)}<div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="openOrder('${id}')">Takaisin</button><button class="btn orange ${o.quoteApproved?'':'blocked'}" onclick="sendQuote('${id}')">✉ Lähetä tarjous asiakkaalle</button></div>`;modal.classList.add('on')}
function sendQuote(id){let o=st.orders.find(x=>x.id===id);if(!o.quoteApproved)return alert('Hyväksy tarjous ensin.');o.quoteSentAt=nowFi();logEvent(o,'Tarjous merkitty lähetetyksi asiakkaalle');save();let sub=encodeURIComponent('Tarjous #'+o.no+' – Copy-Set'),body=encodeURIComponent(`Hei ${o.contact||''},\n\nLiitteenä / mukana Copy-Setin tarjous #${o.no}.\n\nYstävällisin terveisin\nCopy-Set Oy`);location.href=`mailto:${encodeURIComponent(o.email||'')}?subject=${sub}&body=${body}`;showQuote(id)}
function convertQuoteToOrder(id){let o=st.orders.find(x=>x.id===id);o.mode='Tilaus';o.quoteAcceptedAt=nowFi();logEvent(o,'Asiakas hyväksynyt tarjouksen – valmistellaan tilausvahvistus');save();showPreflight(id)}

const _openOrderQuoteOrder=openOrder;
openOrder=function(id){_openOrderQuoteOrder(id);let o=st.orders.find(x=>x.id===id),body=document.getElementById('mb');if(!body)return;let first=body.querySelector('.card');if(first)first.insertAdjacentHTML('afterbegin',modeBannerHtml(o.mode||'Tarjous'));let actions=body.querySelector('.actions:last-child');if(!actions)return;
  if(o.status==='Tarjous'){
    actions.innerHTML=`<button class="btn" onclick="editOrder('${id}')">Muokkaa</button>${o.mode==='Tarjous'?`<button class="btn dark" onclick="${o.quoteApproved?`showQuote('${id}')`:`showPreflight('${id}')`}">${o.quoteApproved?'Avaa tarjous':'Tarkista tarjous'}</button>${o.quoteApproved?`<button class="btn orange" onclick="convertQuoteToOrder('${id}')">✓ Asiakas hyväksyi → vahvista tilaukseksi</button>`:''}`:`<button class="btn orange" onclick="showPreflight('${id}')">Tarkista ja vahvista tilaus</button>`}`;
  }
}

// Compact CRM list: one row per customer; click opens details.
renderCRM=function(){let customers=[...st.customers].sort((a,b)=>(a.company||'').localeCompare(b.company||''));crm.innerHTML=`<div class="card"><div class="toolbar"><div><h2 style="margin:0">Asiakas CRM</h2><div class="small">Kompakti asiakaslista. Klikkaa asiakasta avataksesi kaikki tiedot ja tilaushistorian.</div></div><button class="btn orange" onclick="editCustomer()">+ Lisää asiakas</button></div></div><div class="crm-list"><div class="crm-row crm-head"><div>Asiakas</div><div>Y-tunnus</div><div>Yhteyshenkilö</div><div>Puhelin</div><div>Tilauksia</div><div></div></div>${customers.map(c=>{let os=st.orders.filter(o=>o.customerId===c.id||o.company===c.company);return `<div class="crm-row" onclick="openCustomerDetail('${c.id}')"><div><div class="crm-company">${E(c.company)}</div><div class="crm-sub">${E(c.email||'')} · ${E(c.no||'')}</div></div><div>${E(c.bid||'—')}</div><div>${E(c.contact||'—')}</div><div>${E(c.phone||'—')}</div><div><b>${os.length}</b></div><div><button class="btn" onclick="event.stopPropagation();openCustomerDetail('${c.id}')">Avaa →</button></div></div>`}).join('')}</div>`}
function openCustomerDetail(id){let c=C(id);if(!c)return;let os=st.orders.filter(o=>o.customerId===id||o.company===c.company).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),sales=os.reduce((s,o)=>s+invoiceTotals(normalizeOrder(o)).net,0);mt.textContent=c.company;mb.innerHTML=`<div class="customer-detail-head"><div><div class="small">${E(c.no||'')}</div><h2 style="margin:3px 0">${E(c.company)}</h2><div>${E(c.contact||'')} · ${E(c.email||'')} · ${E(c.phone||'')}</div></div><span class="badge ready">${E(c.status||'Aktiivinen')}</span></div><div class="customer-kpis"><div><span class="small">Tilauksia</span><b>${os.length}</b></div><div><span class="small">Myynti alv 0</span><b>${EU(sales)}</b></div><div><span class="small">Maksuehto</span><b style="font-size:14px">${E(c.terms||'—')}</b></div><div><span class="small">Alennus</span><b>${+c.discount||0}%</b></div></div><div class="review-grid"><div class="review-card"><h4>YRITYSTIEDOT</h4><p>Y-tunnus ${E(c.bid||'—')}<br>Maa ${E(c.country||'Suomi')}<br>${E(c.address||'—')}</p></div><div class="review-card"><h4>LASKUTUS</h4><p>${E(c.billing||'—')}<br>Verkkolasku ${E(c.eInvoice||'—')}<br>Välittäjä ${E(c.operator||'—')}</p></div>${c.notes?`<div class="review-card review-wide"><h4>MUISTIINPANOT</h4><p>${E(c.notes)}</p></div>`:''}</div><div class="actions" style="margin:14px 0"><button class="btn orange" onclick="editCustomer('${id}')">Muokkaa asiakasta</button><button class="btn dark" onclick="orderFor('${id}')">+ Uusi tarjous</button></div><div class="card"><h3>Työhistoria</h3><div class="tablewrap"><table><tr><th>#</th><th>Päivä</th><th>Tuote</th><th>Tyyppi</th><th>Status</th><th>Hinta</th></tr>${os.length?os.map(o=>`<tr onclick="openOrder('${o.id}')" style="cursor:pointer"><td><b>#${E(o.no)}</b></td><td>${E(FI_DATE(o.date))}</td><td>${E(o.product)}</td><td>${E(o.mode||'Tilaus')}</td><td><span class="badge ${statusClass(o.status)}">${E(o.status)}</span></td><td>${EU(invoiceTotals(o).net)}</td></tr>`).join(''):'<tr><td colspan="6" class="small">Ei tilauksia.</td></tr>'}</table></div></div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Sulje</button></div>`;modal.classList.add('on')}





/* === Archive + repeat order workflow 2026-09-14 === */
let archiveQuery='';
function renderArchive(){
  const root=document.getElementById('archive'); if(!root)return;
  let rows=[...st.orders].map(normalizeOrder).filter(o=>o.status==='Laskutettu').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(archiveQuery){const z=archiveQuery.toLowerCase();rows=rows.filter(o=>JSON.stringify(o).toLowerCase().includes(z));}
  root.innerHTML=`<div class="card"><div class="toolbar"><div><h2 style="margin:0">Arkisto / vanhat tilaukset</h2><div class="small">Hae vanha työ ja kopioi se suoraan uudeksi muokattavaksi tilaukseksi.</div></div></div><div class="toolbar" style="margin-top:12px"><input id="archiveSearch" placeholder="Hae asiakas, tilausnumero, tuote, viite tai päivämäärä" value="${E(archiveQuery)}"></div><div class="tablewrap"><table><tr><th>#</th><th>Päivä</th><th>Asiakas</th><th>Tuote</th><th>Määrä</th><th>Hinta</th><th></th></tr>${rows.length?rows.map(o=>`<tr><td><b>#${E(o.no)}</b></td><td>${E(FI_DATE(o.date))}</td><td>${E(o.company)}</td><td>${E(o.product)}</td><td>${E(o.qty)} kpl</td><td>${EU(invoiceTotals(o).net)}</td><td><div class="actions"><button class="btn" onclick="openOrder('${o.id}')">Avaa</button><button class="btn orange" onclick="event.stopPropagation();copyOrderAsk('${o.id}')">⧉ Kopioi uudeksi</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="small">Hakuehdoilla ei löytynyt laskutettuja töitä.</td></tr>'}</table></div></div>`;
  const el=document.getElementById('archiveSearch');if(el)el.oninput=function(){archiveQuery=this.value||'';renderArchive();const n=document.getElementById('archiveSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
}
function copyOrderAsk(id){
  const o=st.orders.find(x=>x.id===id);if(!o)return;normalizeOrder(o);
  if((o.extraLines||[]).length){
    mt.textContent='Kopioi uudeksi tilaukseksi · #'+o.no;
    mb.innerHTML=`<div class="card"><h3>Kopioidaanko myös vanhat lisätyöt?</h3><p>Perustiedot, vanha hinta, aloituskustannus, laskutuslisä, toimitusosoitteet ja mahdollinen alihankkija kopioidaan joka tapauksessa. Kaikkea voi muuttaa ennen vahvistamista.</p><div class="small">Vanhassa työssä on ${(o.extraLines||[]).length} lisätyöriviä.</div><div class="actions" style="margin-top:16px;justify-content:flex-end"><button class="btn" onclick="performCopyOrder('${id}',false)">Älä kopioi lisätöitä</button><button class="btn orange" onclick="performCopyOrder('${id}',true)">Kopioi myös lisätyöt</button></div></div>`;
    modal.classList.add('on');return;
  }
  performCopyOrder(id,false);
}
function performCopyOrder(id,includeExtras){
  const src=st.orders.find(x=>x.id===id);if(!src)return;const o=JSON.parse(JSON.stringify(src));normalizeOrder(o);
  o.id=uid();o.no=String(Math.max(2200,...st.orders.map(x=>+x.no||0))+1);o.mode='Tilaus';o.status='Tarjous';o.date=D(0);o.deadline=D(3);o.deliveryDate=D(3);o.valid=D(14);o.demo=false;
  o.extraLines=includeExtras?JSON.parse(JSON.stringify(src.extraLines||[])):[];o.attachments=[];o.history=[];o.issue='';o.issueLevel='Huomio';o.artworkStatus='Ei tarkistettu';o.invoiceApproved=false;o.invoiceApprovedAt='';o.invoiceNote='';o.quoteApproved=false;o.quoteApprovedAt='';o.quoteSentAt='';o.quoteAcceptedAt='';o.orderApprovedAt='';
  logEvent(o,'Kopioitu vanhasta tilauksesta #'+src.no+(includeExtras?' · lisätyöt kopioitu':' · lisätyöt jätetty pois'));
  st.orders.push(o);save();renderAll();edit=o.id;mode='Tilaus';mt.textContent='Uusi tilaus kopioituna työstä #'+src.no;mb.innerHTML=orderForm(o);modal.classList.add('on');
}
const _openOrderRepeat=openOrder;
openOrder=function(id){
  _openOrderRepeat(id);const o=st.orders.find(x=>x.id===id),body=document.getElementById('mb');if(!o||!body)return;

      if(parts.length>1 && !/^\d{5}\b/.test(parts[parts.length-1])) city=parts[parts.length-1];

  return {street,zip,city,country};
};

<script>
/* === Clickable missing information navigation === */
function missingJumpHtml(orderId,label){
  return `<button type="button" class="missing-jump" onclick="jumpToMissing('${String(orderId).replace(/'/g,"\\'")}','${String(label).replace(/'/g,"\\'")}')">${E(label)}</button>`;
}
function missingTarget(label){
  const clean=String(label||'').trim();
  const numbered=clean.match(/^(Vastaanottaja|Osoite|Postinumero|Kaupunki|Maa)\s+(\d+)$/i);
  if(numbered){
    const keyMap={'vastaanottaja':'recipient','osoite':'address','postinumero':'zip','kaupunki':'city','maa':'country'};
    return {deliveryIndex:Math.max(0,+numbered[2]-1),deliveryKey:keyMap[numbered[1].toLowerCase()]};
  }
  const map={
    'Asiakas':'#fcustomer','Yhteyshenkilö':'#fcontact','Sähköposti':'#femail','Tuote':'#fproduct','Määrä':'#fqty',
    'Työn hinta':'#fprice','Deadline':'#fdeadline','Laskutusosoite':'#fbilling','Y-tunnus':'#fbid','Maksuehto':'#fterms',
    'Alihankkija':'#fvendor','Tilausnumero':'#fno','Toimitusosoite':'#deliveries','Toimitustapa':'[data-method]'
  };
  return {selector:map[clean]||''};
}
function flashMissingTarget(el){
  if(!el)return;
  const box=el.closest('.section,.delivery,.review-card,.card')||el;
  box.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('missing-focus');
  if(typeof el.focus==='function' && !el.matches('[type="hidden"]')){try{el.focus({preventScroll:true})}catch(e){try{el.focus()}catch(_){}}}
  setTimeout(()=>el.classList.remove('missing-focus'),2200);
}
function jumpToMissing(id,label){
  const o=st.orders.find(x=>x.id===id);if(!o)return;
  if(label==='Aineisto OK'){
    openOrder(id);
    setTimeout(()=>{
      const btn=[...document.querySelectorAll('#mb button')].find(b=>(b.textContent||'').includes('Aineisto OK'));
      if(btn)flashMissingTarget(btn);
    },40);
    return;
  }
  if(label==='Laskun hyväksyntä'){
    showInvoiceReview(id);return;
  }
  editOrder(id);
  setTimeout(()=>{
    const t=missingTarget(label);
    let el=null;
    if(t.deliveryKey){
      let rows=[...document.querySelectorAll('[data-del]')];
      while(rows.length<=t.deliveryIndex){addDel();rows=[...document.querySelectorAll('[data-del]')];}
      el=rows[t.deliveryIndex]?.querySelector(`[data-k="${t.deliveryKey}"]`);
    }else if(label==='Toimitusosoite'){
      let rows=[...document.querySelectorAll('[data-del]')];if(!rows.length){addDel();rows=[...document.querySelectorAll('[data-del]')];}
      el=rows[0]?.querySelector('[data-k="address"]')||document.querySelector('#deliveries');
    }else if(label==='Toimitustapa'){
      el=document.querySelector('[data-method]');
    }else{
      el=t.selector?document.querySelector(t.selector):null;
    }
    if(el)flashMissingTarget(el);
  },50);
}

warnHtml=function(o,target){
  let m=missingFor(o,target);
  return m.length?`<div class="warnbar bad"><b>⚠ ${m.length} puuttuvaa tietoa ennen vaihetta ${target}</b><div class="miss">${m.map(x=>missingJumpHtml(o.id,x)).join('')}</div><div class="small" style="margin-top:7px">Klikkaa puuttuvaa tietoa – ohjelma vie suoraan oikeaan kenttään.</div></div>`:`<div class="warnbar ok"><b>✓ Kaikki pakolliset tiedot kunnossa vaiheeseen ${target}</b></div>`;
};

showPreflight=function(id){
  let o=st.orders.find(x=>x.id===id);normalizeOrder(o);let m=missingFor(o,'Vahvistettu'),isOrder=o.mode==='Tilaus';
  mt.textContent=(isOrder?'Tarkista tilaus':'Tarkista tarjous')+' · #'+o.no;
  mb.innerHTML=`${modeBannerHtml(o.mode)}${m.length?`<div class="warnbar bad"><b>⚠ ${m.length} tietoa puuttuu</b><div class="miss">${m.map(x=>missingJumpHtml(o.id,x)).join('')}</div><div class="small" style="margin-top:7px">Klikkaa puuttuvaa tietoa – ohjelma avaa muokkauksen ja vie suoraan oikeaan kenttään.</div></div>`:'<div class="warnbar ok"><b>✓ Kaikki pakolliset tiedot ovat kunnossa.</b><div class="small">Tarkista yhteenveto vielä kerran ennen hyväksyntää.</div></div>'}${reviewRows(o)}<div class="preflight-actions"><button class="btn" onclick="editOrder('${id}')">← Muokkaa tietoja</button>${isOrder?`<button class="btn orange big-primary ${m.length?'blocked':''}" onclick="approveDirectOrder('${id}')">✓ Hyväksy ja vahvista tilaus</button>`:`<button class="btn orange big-primary ${m.length?'blocked':''}" onclick="approveQuote('${id}')">✓ Hyväksy tarjous</button>`}</div>`;
  modal.classList.add('on');
};

<script>
/* Dashboard 2.0: päivä / viikko / kuukausi / vuosi / oma aikaväli */
let dashboardPeriod='month', dashboardFrom='', dashboardTo='';
function dashIso(d){return d.toISOString().slice(0,10)}
function dashLocalDate(v){if(!v)return null;let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function dashRange(kind){
  let now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),now.getDate()), end=new Date(start);
  if(kind==='day'){}
  else if(kind==='week'){let wd=(start.getDay()+6)%7;start.setDate(start.getDate()-wd);end=new Date(start);end.setDate(end.getDate()+6)}
  else if(kind==='month'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0)}
  else if(kind==='year'){start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear(),11,31)}
  else {let a=dashLocalDate(dashboardFrom),b=dashLocalDate(dashboardTo);if(a)start=a;if(b)end=b;if(start>end)[start,end]=[end,start]}
  return {start,end,from:dashIso(start),to:dashIso(end)};
}
function setDashboardPeriod(k){dashboardPeriod=k;renderDashboard()}
function setDashboardCustom(){dashboardFrom=document.getElementById('dashFrom')?.value||'';dashboardTo=document.getElementById('dashTo')?.value||'';if(!dashboardFrom||!dashboardTo)return alert('Valitse alku- ja loppupäivä.');dashboardPeriod='custom';renderDashboard()}

function dashTimeline(a,r){
  let days=Math.round((r.end-r.start)/86400000)+1, buckets=[];
  if(days<=14){for(let i=0;i<days;i++){let d=new Date(r.start);d.setDate(d.getDate()+i);let key=dashIso(d);buckets.push({key,label:new Intl.DateTimeFormat('fi-FI',{day:'numeric',month:'numeric'}).format(d),v:0})}}

  <div class="dash-custom"><div><label>Alkaen</label><input id="dashFrom" type="date" value="${E(dashboardFrom||r.from)}"></div><div><label>Saakka</label><input id="dashTo" type="date" value="${E(dashboardTo||r.to)}"></div><button class="btn orange" onclick="setDashboardCustom()">Näytä aikaväli</button></div>

  </div>

   <div class="card dash-panel"><div class="dash-panel-head"><div><h3>Työnkulku</h3><div class="small">Töiden tämänhetkinen status</div></div></div>${FLOW.map(s=>{let n=a.filter(o=>o.status===s).length,p=a.length?Math.round(n/a.length*100):0;return `<div class="dash-status-row"><b>${E(s)}</b><div class="dash-status-track"><div class="dash-status-fill" style="width:${p}%"></div></div><div class="dash-status-num">${n}</div></div>`}).join('')}</div>

  </div>`;

/* Varmista että Dashboard 2.0 korvaa vanhan dashboardin heti sivun latauksessa. */
renderDashboard();

document.querySelectorAll('.nav[data-v="dashboard"]').forEach(function(btn){

<script>
/* === Yhtenäinen TIL-numerointi === */
(function(){
  function orderYear(o){
    const d=String(o.date||o.orderDate||'');
    const m=d.match(/^(\d{4})-/);
    return m?+m[1]:new Date().getFullYear();
  }
  function normalizeOrderNumbers(){
    if(!window.st||!Array.isArray(st.orders)) return;
    const orders=st.orders.filter(o=>o.mode!=='Tarjous');
    const groups={};
    orders.forEach(o=>{const y=orderYear(o);(groups[y]||(groups[y]=[])).push(o)});
    let changed=false;
    Object.keys(groups).forEach(y=>{
      const arr=groups[y];
      arr.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.id||'').localeCompare(String(b.id||'')));
      arr.forEach((o,i)=>{
        const wanted=`TIL-${y}-${String(i+1).padStart(4,'0')}`;
        if(o.no!==wanted){o.no=wanted;changed=true}
      });
    });
    // Päivitä tarjouksen näkyvä linkitys luotuun tilaukseen ID:n perusteella.
    st.orders.filter(o=>o.mode==='Tarjous'&&o.convertedOrderId).forEach(q=>{
      const target=st.orders.find(x=>x.id===q.convertedOrderId);
      if(target&&q.convertedOrderNo!==target.no){q.convertedOrderNo=target.no;changed=true}
    });
    if(changed){try{save()}catch(e){}}
  }
  // Numerointi korjataan kerran latauksessa ennen käyttäjän seuraavia toimia.
  normalizeOrderNumbers();
  // Vahvempi generaattori: aina suurin olemassa oleva TIL-numero + 1.
  const oldNext=window.nextDocNo;
  window.nextDocNo=function(prefix){
    if(prefix!=='TIL') return oldNext(prefix);
    const year=new Date().getFullYear(), re=new RegExp('^TIL-'+year+'-(\\d+)$');
    let max=0; st.orders.filter(o=>o.mode!=='Tarjous').forEach(o=>{const m=String(o.no||'').match(re);if(m)max=Math.max(max,+m[1])});
    return `TIL-${year}-${String(max+1).padStart(4,'0')}`;
  };
  try{renderAll()}catch(e){}
})();
</script>

<script>

let orderFilter='Kaikki';
function orderLocalISO(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function orderWeekEndISO(){let d=new Date(),day=d.getDay()||7;d.setDate(d.getDate()+(7-day));return orderLocalISO(d)}
function orderIsLate(o){return o.status!=='Laskutettu'&&!!o.deadline&&o.deadline<orderLocalISO()}
function orderFilterMatch(o,f){if(f==='Kaikki')return o.status!=='Laskutettu';if(f==='Tänään')return o.status!=='Laskutettu'&&o.deadline===orderLocalISO();if(f==='Tällä viikolla'){let t=orderLocalISO(),e=orderWeekEndISO();return o.status!=='Laskutettu'&&!!o.deadline&&o.deadline>=t&&o.deadline<=e}if(f==='Myöhässä')return orderIsLate(o);return o.status===f}
function setOrderFilter(f){orderFilter=f;renderOrders()}
function orderFilterCount(all,f){return all.filter(o=>orderFilterMatch(o,f)).length}
renderOrders=function(){
  let all=st.orders.filter(o=>(o.mode||'Tilaus')!=='Tarjous').map(v2EnsureProducts);
  let a=all.filter(o=>orderFilterMatch(o,orderFilter)).sort((x,y)=>(x.deadline||'9999').localeCompare(y.deadline||'9999'));

<script id="v2-clean-core">

FLOW.splice(0,FLOW.length,'Tarjous',...V2_FLOW);

 o.products.forEach(x=>{x.id=x.id||uid();x.name=x.name||'Muu tuote';x.qty=+x.qty||1;x.price=+x.price||0;x.description=x.description||'';x.extras=Array.isArray(x.extras)?x.extras:[]});
 v2SyncLegacy(o);return o;

st.orders.forEach(v2EnsureProducts);save();

 add(o.products.length,'Tuote','v2products');o.products.forEach((p,i)=>{add(p.name,`Tuote ${i+1}`,'v2products');add(+p.qty>0,`Määrä ${i+1}`,'v2products');add(+p.price>=0,`Hinta ${i+1}`,'v2products')});

productionTasks=function(o){v2EnsureProducts(o);let t=[{name:'Aineiston tarkistus',note:'Tarkista tiedostot, mitat, leikkuuvarat ja painokelpoisuus',tag:'AINEISTO'}];o.products.forEach((p,i)=>{t.push({name:`${i+1}. ${p.name} · ${p.qty} kpl`,note:p.description||'Valmista tilauksen määritysten mukaan',tag:'TUOTE'});(p.extras||[]).forEach(e=>t.push({name:e.label,note:`Tuote: ${p.name}`,tag:'LISÄTYÖ'}))});t.push({name:'Laaduntarkistus',note:'Tarkista määrä, laatu ja viimeistely',tag:'LAATU'},{name:'Pakkaus',note:'Pakkaa toimitustavan ja osoitteiden mukaan',tag:'PAKKAUS'});return t}
const _v2ProdDoc=productionDocHtml;productionDocHtml=function(o){v2EnsureProducts(o);let h=_v2ProdDoc(o);h=h.replace(/<div class="doc-section"><h3>TYÖN TIEDOT<\/h3>[\s\S]*?<\/div><div class="doc-section"><h3>TYÖOHJE<\/h3>[\s\S]*?<\/div>/,`<div class="doc-section"><h3>TUOTTEET JA TYÖOHJEET</h3>${v2ProductsTable(o,false)}</div>`);h=h.replace(/□ Jälkikäsittely valmis/g,'');return h}

<script>

 let count=f=>all.filter(o=>v2OrderMatch(o,f)).length;
 orders.innerHTML=`<div class="card"><div class="toolbar"><input id="search" placeholder="Hae tilausnumero, asiakas tai tuote" value="${E(q)}"></div><div class="order-filterbar">${filters.map(f=>`<button class="order-filter ${v2OrderFilter===f?'on':''} ${f==='Myöhässä'?'late':''}" onclick="v2SetOrderFilter('${f}')">${f==='Myöhässä'?'⚠ ':''}${f}<b>${count(f)}</b></button>`).join('')}</div><div class="tablewrap"><table><tr><th>Tilaus</th><th>Deadline</th><th>Asiakas</th><th>Tuotteet</th><th>Status</th><th>Seuraava vaihe</th></tr>${a.length?a.map(o=>`<tr onclick="openOrder('${o.id}')" style="cursor:pointer"><td><b>${E(o.no)}</b></td><td><b>${FI_DATE(o.deadline)}</b>${v2OrderLate(o)?'<div class="small" style="color:#b42318;font-weight:800">MYÖHÄSSÄ</div>':''}</td><td>${E(o.company)}</td><td>${o.products.map(p=>`${E(p.name)} · ${p.qty}`).join('<br>')}</td><td><span class="badge ${statusClass(o.status)}">${E(o.status)}</span></td><td>${o.status==='Laskutettu'?'<span class="small">✓ Valmis</span>':`<button class="btn orange" onclick="event.stopPropagation();v2Advance('${o.id}')">${v2NextLabel(o)} →</button>`}</td></tr>`).join(''):`<tr><td colspan="6"><div class="order-empty">Ei tilauksia tällä rajauksella.</div></td></tr>`}</table></div></div>`;
 let s=document.getElementById('search');if(s)s.oninput=e=>{q=e.target.value;renderOrders();let n=document.getElementById('search');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
}
renderOrders();
</script>
