<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CopySet ERP</title>
</head>
<body>
<script>
(function bootstrapCopySet() {
  const version = '20260917-selective64';

  const styles = [
    'styles/base.css',
    'styles/documents.css',
    'styles/forms.css',
    'approved-layout.css',
    'order-page.css',
    'form-layout.css',
    'theme-polish.css',
    'mobile-layout.css'
  ];

  // Script order is intentional: configuration and state load before feature modules.
  const scripts = [
    'config.js',
    'app-core.js',
    'numbering-fix.js',
    'customers.js',
    'form-lifecycle.js',
    'form-layout.js',
    'customer-form.js',
    'order-form-data.js',
    'order-form-save.js',
    'order-form-renderer.js',
    'order-form-controller.js',
    'quotes.js',
    'quotes-list.js',
    'orders-list.js',
    'orders.js',
    'pricing-admin.js',
    'pricing.js',
    'core-actions.js',
    'invoice-review.js',
    'confirmation.js',
    'order-page.js',
    'dashboard.js',
    'archive.js',
    'crm.js',
    'secondary-views.js'
  ];

  const cleanBootstrap = `<script>
(function activateCleanModules() {
  if (!window.CopySet) return;

  const renderers = [
    ['renderQuotes', 'renderQuotes'],
    ['renderOrders', 'renderOrders'],
    ['renderDashboard', 'renderDashboard'],
    ['renderArchive', 'renderArchive'],
    ['renderCRM', 'renderCRM'],
    ['renderProducts', 'renderProducts'],
    ['renderSuppliers', 'renderSuppliers'],
    ['renderMarketing', 'renderMarketing'],
    ['renderPricing', 'renderPricing']
  ];

  renderers.forEach(([globalName, moduleName]) => {
    const renderer = CopySet[moduleName];
    if (typeof renderer !== 'function') return;
    window[globalName] = renderer;
    renderer();
  });

  if (CopySet.pricing && typeof CopySet.pricing.enhance === 'function') {
    CopySet.pricing.enhance();
  }

  document.dispatchEvent(new CustomEvent('copyset:clean-ready'));
})();
<\\/script>`;

  const styleTags = styles
    .map(path => `<link rel="stylesheet" href="/${path}?v=${version}">`)
    .join('');

  const scriptTags = scripts
    .map(path => `<script src="/${path}?v=${version}"><\\/script>`)
    .join('');

  const selectedScripts = [
    'config.js',
    'app-core.js',
    'pricing-admin.js',
    'pricing.js',
    'orders.js',
    'core-actions.js',
    'order-page.js',
    'legacy-ui-patch.js',
    'selective-runtime.js'
  ].map(path => '<script src="/' + path + '?v=' + version + '"></scr' + 'ipt>').join('');
  const assets = styleTags + selectedScripts;

  fetch(`/app-base.html?v=${version}`)
    .then(response => {
      if (!response.ok) throw new Error(`app-base ${response.status}`);
      return response.text();
    })
    .then(html => {
      const bodyEnd = html.toLowerCase().lastIndexOf('</body>');
      const page = bodyEnd >= 0
        ? html.slice(0, bodyEnd) + assets + html.slice(bodyEnd)
        : html + assets;

      document.open();
      document.write(page);
      document.close();
    })
    .catch(error => {
      document.body.innerHTML =
        `<div style="font-family:Arial;padding:30px">CopySet ERP loading error: ${error.message}</div>`;
    });
})();
</script>
</body>
</html>
