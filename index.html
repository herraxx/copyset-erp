<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CopySet ERP</title>
</head>
<body>
<script>
(function bootstrapCopySet() {
  'use strict';

  const version = '20260917-cleanup-preview-01';
  const styles = [
    'styles/base.css',
    'styles/documents.css',
    'styles/forms.css',
    'approved-layout.css',
    'order-page.css',
    'form-layout.css',
    'theme-polish.css',
    'mobile-layout.css'
  ];
  const scripts = [
    'config.js',
    'app-core.js',
    'pricing-admin.js',
    'pricing.js',
    'orders.js',
    'core-actions.js',
    'order-page.js',
    'app-runtime.js'
  ];

  const assets = styles
    .map(path => '<link rel="stylesheet" href="/' + path + '?v=' + version + '">')
    .concat(scripts.map(path => '<script src="/' + path + '?v=' + version + '"><\/script>'))
    .join('');

  fetch('/app-base.html?v=' + version)
    .then(response => {
      if (!response.ok) throw new Error('app-base ' + response.status);
      return response.text();
    })
    .then(html => {
      const bodyEnd = html.toLowerCase().lastIndexOf('</body>');
      const page = bodyEnd >= 0
        ? html.slice(0, bodyEnd) + assets + html.slice(bodyEnd)
        : html + assets;

      document.open();
      document.write(page);
      document.close();
    })
    .catch(error => {
      document.body.innerHTML =
        '<div role="alert" style="font-family:Arial,sans-serif;padding:30px">' +
        'CopySet ERP loading error: ' + error.message +
        '</div>';
    });
})();
</script>
</body>
</html>
